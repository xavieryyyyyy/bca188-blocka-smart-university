[env:sim]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -DSIM_SENSOR=1 -DPIN_SDA=21 -DPIN_SCL=22
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21.5

[env:esp32-wroom]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -DSIM_SENSOR=0 -DPIN_SDA=21 -DPIN_SCL=22
lib_deps =
    adafruit/Adafruit TSL2561@^1.1.2
    adafruit/Adafruit Unified Sensor
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21.5

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags = -DSIM_SENSOR=0 -DPIN_SDA=8 -DPIN_SCL=9
lib_deps = ${env:esp32-wroom.lib_deps}